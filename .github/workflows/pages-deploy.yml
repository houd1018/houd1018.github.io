name: Deploy static site

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - LICENSE
      - "_legacy_backup/**"
      - "portfolio_Legacy/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only the site allowlist; archives, scripts and media sources stay out of the artifact.
      - name: Assemble site
        run: |
          mkdir -p _site
          for p in index.html 404.html config.js .nojekyll css js data projects professional blog assets/img; do
            if [ -e "$p" ]; then cp -r --parents "$p" _site/; fi
          done
          ls -la _site

      - name: Guard against media in the artifact
        run: |
          bad=$(find _site -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.webm' -o -iname '*.m4v' -o -size +2M \))
          if [ -n "$bad" ]; then
            echo "::error::Media/large files must be served from MEDIA_BASE_URL, not GitHub Pages:"
            echo "$bad"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
